# [Step 0-2] 환경 세팅과 공통 설정 (application.yaml)
spring:
  application:
    name: rag-and-image
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  cloud:
    aws:
      credentials:
        access-key: ${SUPABASE_S3_ACCESS_KEY}
        secret-key: ${SUPABASE_S3_SECRET_KEY}
      region:
        static: ${SUPABASE_S3_REGION}
      s3:
        endpoint: ${SUPABASE_S3_ENDPOINT}
        path-style-access-enabled: true
  ai:
    model:
      embedding: google-genai
    google:
      genai:
        api-key: ${GOOGLE_AI_API_KEY}
        chat:
          model: ${app.ai.google.primary-model}
        embedding:
          text:
            model: gemini-embedding-001
            dimensions: 1536
    openai:
      api-key: ${GOOGLE_AI_API_KEY}
      embedding:
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_store

app:
  storage:
    bucket: ${SUPABASE_S3_BUCKET}
  ai:
    google:
      primary-model: gemini-3.5-flash-lite
    rag:
      top-k: 5
      similarity-threshold: 0.7
    image:
      allowed-mime-types: image/png, image/jpeg
      max-dimension-px: 1536
    image-rag:
      top-k: 8
      similarity-threshold: 0.5
    image-generation:
      account-id: ${CF_ACCOUNT_ID}
      api-token: ${CF_API_TOKEN}
      base-url: https://api.cloudflare.com/client/v4
      model: "@cf/black-forest-labs/flux-1-schnell"
      steps: 4
      timeout: 60s
